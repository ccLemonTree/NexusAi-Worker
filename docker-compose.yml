version: "3.8"

x-triton-base: &triton-base
  image: aisfh5.com:9091/triton-server/triton-server-nvidia:25.11-sam3-lpr
  command:
    - tritonserver
    - --model-repository=/models
    - --strict-model-config=false
    - --log-verbose=1
    - --model-control-mode=explicit
    - --load-model=*
  restart: unless-stopped
  shm_size: "3g"
  logging: &logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - /ai/chen/code/huggingface/aiseefor_model/:/models
  healthcheck:
    test: ["CMD-SHELL", "curl -fsS http://localhost:8000/v2/health/ready || exit 1"]
    interval: 30s
    start_period: 6m
    timeout: 10s
    retries: 10

x-inference-env: &inference-env
  WORKER_MAX_CONCURRENT: "${WORKER_MAX_CONCURRENT:-16}"
  WORKER_AUTH_TOKEN: "${WORKER_AUTH_TOKEN:?WORKER_AUTH_TOKEN is required}"
  TRITON_MAX_WORKERS: "32"
  LOGIC_MAX_WORKERS: "32"
  IO_MAX_WORKERS: "8"
  INFER_BACKEND: "fire"
  STRUCT_EMBEDDING_MODEL: "http://ainginx:10425/v1"
  STRUCT_EMBEDDING_MODEL_NAME: "Qwen2.5-VL-7B-Instruct"
  MILVUS_CLIENT: "http://10.120.0.66:19530"
  MILVUS_DB_NAME: "vsearch_clip"
  MILVUS_VECTOR_COLLECTION_NAME: "vector"
  MILVUS_VECTOR_FILTER_COLLECTION_NAME: "vector_filter"
  MILVUS_FACE_COLLECTION_NAME: "face"
  MILVUS_PLATE_COLLECTION_NAME: "plate"
  MILVUS_FACE_DATABASE_COLLECTION_NAME: "face_database"
  EOS_ACCESS_KEY: "${EOS_ACCESS_KEY:?EOS_ACCESS_KEY is required}"
  EOS_SECRET_KEY: "${EOS_SECRET_KEY:?EOS_SECRET_KEY is required}"
  EOS_ENDPOINT: "https://eos-ningbo-1-internal.cmecloud.cn"
  EOS_BUCKET: "aisf-back-lsyd"
  OBJ_SAVE_PIC_LOCPATH: "/ai/capture/back/search_pic"
  VLM_TIMEOUT: "5"
  MODEL_TIMEOUT: "5"
  VECTOR_TIMEOUT: "5"
  IMAGE_VECTOR_URL: "http://10.120.0.196:10425/v1"
  VLLM_BASE_URL: "http://10.120.0.196:10425/v1"
  SEARCH_VECTOR_URL: "http://10.120.0.196:10425/v1"
  RERANKER_URL: "http://10.120.0.66:30009/v1/rerank/image-to-texts"

x-worker-base: &worker-base
  image: nexusai-inference:local
  build: .
  command: ["python", "worker_main.py"]
  restart: unless-stopped
  stop_grace_period: 2m
  logging: *logging
  volumes:
    - /ai/capture/back/search_pic:/ai/capture/back/search_pic
  environment:
    <<: *inference-env
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
    interval: 10s
    start_period: 60s
    timeout: 3s
    retries: 3

services:
  triton-server1:
    <<: *triton-base
    container_name: triton-server1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  nexusai-worker1:
    <<: *worker-base
    container_name: nexusai-worker1
    depends_on:
      triton-server1:
        condition: service_healthy
    environment:
      <<: *inference-env
      TRITON_SERVER: "triton-server1:8001"
      TRITON_SERVER_VLM: "triton-server1:8001"
      TRITON_SERVER_SAM3: "triton-server1:8001"

  triton-server2:
    <<: *triton-base
    container_name: triton-server2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  nexusai-worker2:
    <<: *worker-base
    container_name: nexusai-worker2
    depends_on:
      triton-server2:
        condition: service_healthy
    environment:
      <<: *inference-env
      TRITON_SERVER: "triton-server2:8001"
      TRITON_SERVER_VLM: "triton-server2:8001"
      TRITON_SERVER_SAM3: "triton-server2:8001"

  triton-server3:
    <<: *triton-base
    container_name: triton-server3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

  nexusai-worker3:
    <<: *worker-base
    container_name: nexusai-worker3
    depends_on:
      triton-server3:
        condition: service_healthy
    environment:
      <<: *inference-env
      TRITON_SERVER: "triton-server3:8001"
      TRITON_SERVER_VLM: "triton-server3:8001"
      TRITON_SERVER_SAM3: "triton-server3:8001"

  triton-server4:
    <<: *triton-base
    container_name: triton-server4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]

  nexusai-worker4:
    <<: *worker-base
    container_name: nexusai-worker4
    depends_on:
      triton-server4:
        condition: service_healthy
    environment:
      <<: *inference-env
      TRITON_SERVER: "triton-server4:8001"
      TRITON_SERVER_VLM: "triton-server4:8001"
      TRITON_SERVER_SAM3: "triton-server4:8001"

networks:
  default:
    name: nexusai-runtime
