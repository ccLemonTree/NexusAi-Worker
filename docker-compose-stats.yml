version: "3.8"

# Stats deployment reuses the inference topology and only overrides endpoints.
services:
  triton-server1:
    extends:
      file: docker-compose.yml
      service: triton-server1

  nexusai-worker1:
    extends:
      file: docker-compose.yml
      service: nexusai-worker1
    environment: &stats-endpoints
      IMAGE_VECTOR_URL: "http://10.120.0.242:30008/v1"
      VLLM_BASE_URL: "http://10.120.0.242:30008/v1"
      SEARCH_VECTOR_URL: "http://10.120.0.242:30008/v1"
      RERANKER_URL: "http://10.120.0.82:30009/v1/rerank/image-to-texts"

  triton-server2:
    extends:
      file: docker-compose.yml
      service: triton-server2

  nexusai-worker2:
    extends:
      file: docker-compose.yml
      service: nexusai-worker2
    environment:
      <<: *stats-endpoints

  triton-server3:
    extends:
      file: docker-compose.yml
      service: triton-server3

  nexusai-worker3:
    extends:
      file: docker-compose.yml
      service: nexusai-worker3
    environment:
      <<: *stats-endpoints

  triton-server4:
    extends:
      file: docker-compose.yml
      service: triton-server4

  nexusai-worker4:
    extends:
      file: docker-compose.yml
      service: nexusai-worker4
    environment:
      <<: *stats-endpoints

networks:
  default:
    name: nexusai-runtime
