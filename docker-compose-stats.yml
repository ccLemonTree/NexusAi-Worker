version: "3.8"

x-triton-base: &triton-base
  image: aisfh5.com:9091/triton-server/triton-server-nvidia:25.11-sam3-lpr
  command:
    - tritonserver
    - --model-repository=/models
    - --strict-model-config=false
    - --log-verbose=1
    - --model-control-mode=explicit
    - --load-model=*
  restart: unless-stopped
  shm_size: "3g"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - /ai/chen/code/huggingface/aiseefor_model/:/models
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "curl -fsS http://localhost:8000/v2/health/ready || exit 1"
      ]
    interval: 30s
    start_period: 120s
    timeout: 10s
    retries: 10

x-worker-env: &worker-env
  KAFKA_BOOTSTRAP: "10.215.253.59:30322"
  KAFKA_USERNAME: "hzxf"
  KAFKA_PASSWORD: "${KAFKA_PASSWORD:?KAFKA_PASSWORD is required}"
  KAFKA_MAX_CONCURRENT: "16"
  KAFKA_RESULT_TOPIC: "model_analyse_result"
  # 心跳超时配置（缓解 rebalance）
  KAFKA_SESSION_TIMEOUT_MS: "90000"      # 从 30s 增加到 90s
  KAFKA_HEARTBEAT_INTERVAL_MS: "30000"   # 30s（必须 < session_timeout_ms/3）
  KAFKA_MAX_POLL_INTERVAL_MS: "600000"   # 10分钟（已存在，确认配置）

  # 结果发送超时（防止阻塞）
  KAFKA_SEND_TIMEOUT: "10"               # 10秒超时
  TRITON_MAX_WORKERS: "32"
  LOGIC_MAX_WORKERS: "32"
  IO_MAX_WORKERS: "8"

  INFER_BACKEND: "fire"

  STRUCT_EMBEDDING_MODEL: "http://ainginx:10425/v1"
  STRUCT_EMBEDDING_MODEL_NAME: "Qwen2.5-VL-7B-Instruct"

  MILVUS_CLIENT: "http://10.120.0.66:19530"
  MILVUS_DB_NAME: "vsearch_clip"
  MILVUS_VECTOR_COLLECTION_NAME: "vector"
  MILVUS_VECTOR_FILTER_COLLECTION_NAME: "vector_filter"
  MILVUS_FACE_COLLECTION_NAME: "face"
  MILVUS_PLATE_COLLECTION_NAME: "plate"
  MILVUS_FACE_DATABASE_COLLECTION_NAME: "face_database"

  EOS_ACCESS_KEY: "8DEEFL5I19XFGAO558QX"
  EOS_SECRET_KEY: "qkbPJ3O8kID2ovCACgIIJzlFYdC8UMVaj42N4MOH"
  EOS_ENDPOINT: "https://eos-ningbo-1-internal.cmecloud.cn"
  EOS_BUCKET: "aisf-back-lsyd"

  OBJ_SAVE_PIC_LOCPATH: "/ai/capture/back/search_pic"

  VLM_TIMEOUT: "5"
  MODEL_TIMEOUT: "5"
  VECTOR_TIMEOUT: "5"
  IMAGE_VECTOR_URL: "http://10.120.0.242:30008/v1"
  VLLM_BASE_URL: "http://10.120.0.242:30008/v1"
  SEARCH_VECTOR_URL: "http://10.120.0.242:30008/v1"

  RERANKER_URL: "http://10.120.0.82:30009/v1/rerank/image-to-texts"

  # 统计配置
  KAFKA_STATS_DIR: "/logs/kafka_stats"

x-worker-base: &worker-base
  image: aisfh5.com:9091/nexusai/nexusai-kafka-worker:v20260723-stable
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - /ai/capture/back/search_pic:/ai/capture/back/search_pic
    - /ai/logs/kafka_stats:/logs/kafka_stats  # 统计文件挂载
  environment:
    <<: *worker-env

services:
  triton-server1:
    <<: *triton-base
    container_name: triton-server1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  nexusai-kafka-worker1:
    <<: *worker-base
    container_name: nexusai-kafka-worker1
    hostname: nexusai-kafka-worker1  # 设置 hostname，用于统计文件命名
    depends_on:
      triton-server1:
        condition: service_healthy
    environment:
      <<: *worker-env
      TRITON_SERVER: "triton-server1:8001"
      TRITON_SERVER_VLM: "triton-server1:8001"

  triton-server2:
    <<: *triton-base
    container_name: triton-server2
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]

  nexusai-kafka-worker2:
    <<: *worker-base
    container_name: nexusai-kafka-worker2
    hostname: nexusai-kafka-worker2
    depends_on:
      triton-server2:
        condition: service_healthy
    environment:
      <<: *worker-env
      TRITON_SERVER: "triton-server2:8001"
      TRITON_SERVER_VLM: "triton-server2:8001"

  triton-server3:
    <<: *triton-base
    container_name: triton-server3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["2"]
              capabilities: [gpu]

  nexusai-kafka-worker3:
    <<: *worker-base
    container_name: nexusai-kafka-worker3
    hostname: nexusai-kafka-worker3
    depends_on:
      triton-server3:
        condition: service_healthy
    environment:
      <<: *worker-env
      TRITON_SERVER: "triton-server3:8001"
      TRITON_SERVER_VLM: "triton-server3:8001"

  triton-server4:
    <<: *triton-base
    container_name: triton-server4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["3"]
              capabilities: [gpu]

  nexusai-kafka-worker4:
    <<: *worker-base
    container_name: nexusai-kafka-worker4
    hostname: nexusai-kafka-worker4
    depends_on:
      triton-server4:
        condition: service_healthy
    environment:
      <<: *worker-env
      TRITON_SERVER: "triton-server4:8001"
      TRITON_SERVER_VLM: "triton-server4:8001"
